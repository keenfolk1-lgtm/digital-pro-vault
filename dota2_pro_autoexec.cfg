// ============================================================================
// DOTA 2 PRO AUTOEXEC.CFG (PATCH 7.38+ — HIGH FPS, SMART CAST & CAMERA)
// Установка: Steam\steamapps\common\dota 2 beta\game\dota\cfg\autoexec.cfg
// Параметры запуска Steam: -novid -high -map dota -nojoy +exec autoexec.cfg
// ============================================================================

fps_max "240"
dota_camera_accelerate "50"
dota_camera_speed "4200"
dota_camera_disable_zoom "1"
dota_disable_range_finder "0"
dota_minimap_hero_size "950"
dota_minimap_misclick_time "0"
dota_player_multipler_orders "1"
dota_player_smart_multiunit_cast "1"
dota_summoned_units_auto_attack_mode_2 "-1"
cl_dota_alt_unit_movetooltip "1" // Идти строго в направлении курсора (без обхода препятствий — идеально для Shadow Fiend / Slark / Mirana)

// --- СЕТЬ И ОТКЛИК ---
rate "100000"
cl_updaterate "60"
cl_cmdrate "60"
cl_interp "0.016"
cl_interp_ratio "1"

// --- БИНДЫ НА КАМЕРУ РУН (F2 = ВЕРХНЯЯ РУНА, F3 = НИЖНЯЯ РУНА) ---
bind "F2" "dota_camera_set_lookatpos -1750 1200"
bind "F3" "dota_camera_set_lookatpos 1600 -1350"

echo ">>> DOTA 2 PRO AUTOEXEC LOADED! <<<"