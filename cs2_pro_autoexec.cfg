// ============================================================================
// CS2 PRO AUTOEXEC.CFG (2026 EDITION — DONK / M0NESY / ZYWOO OPTIMIZED)
// Установка: скопируйте в Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// Параметры запуска Steam: -high -novid -nojoy +exec cs2_pro_autoexec.cfg
// ============================================================================

fps_max "0"
rate "1000000"
cl_interp_ratio "1"
cl_updaterate "128"
cl_teamid_overhead_mode "2"
cl_teammate_colors_show "1"
cl_Autohelp "0"
r_show_build_info "0"
r_drawtracers_firstperson "1"
r_fullscreen_gamma "2.1"

// --- ИДЕАЛЬНЫЙ РАДАР (ВИДНА ВСЯ КАРТА) ---
cl_hud_radar_scale "1.15"
cl_radar_always_centered "0"
cl_radar_icon_scale_min "0.6"
cl_radar_rotate "1"
cl_radar_scale "0.35"

// --- ЗВУК (ЧЕТКИЕ ШАГИ И ТАЙМЕР БОМБЫ) ---
snd_headphone_eq "1"
snd_spatialize_lerp "0.5"
snd_steamaudio_enable_perspective_correction "0"
snd_tensecondwarning_volume "0.25"
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundend_volume "0"
snd_mvp_volume "0.1"

// --- PRO ПРИЦЕЛЫ (ПЕРЕКЛЮЧЕНИЕ В КОНСОЛИ: donk_xhair / m0nesy_xhair) ---
alias "donk_xhair" "cl_crosshairstyle 4; cl_crosshairsize 1.5; cl_crosshairthickness 0.5; cl_crosshairgap -3; cl_crosshair_drawoutline 0; cl_crosshairdot 0; cl_crosshaircolor 1"
alias "m0nesy_xhair" "cl_crosshairstyle 4; cl_crosshairsize 1.5; cl_crosshairthickness 0; cl_crosshairgap -3.5; cl_crosshair_drawoutline 0; cl_crosshairdot 0; cl_crosshaircolor 4"
alias "zywoo_xhair" "cl_crosshairstyle 4; cl_crosshairsize 1.5; cl_crosshairthickness 0.5; cl_crosshairgap -2.5; cl_crosshair_drawoutline 0; cl_crosshairdot 0; cl_crosshaircolor 1"
donk_xhair

// --- VIEWMODEL (КАК У КИБЕРСПОРТСМЕНОВ) ---
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "0"
viewmodel_offset_z "-1.5"
viewmodel_presetpos "2"

// --- БЫСТРЫЕ БИНДЫ НА ГРАНАТЫ И ДРОП БОМБЫ ---
bind "c" "slot7"        // Флешка
bind "x" "slot8"        // Смок
bind "z" "slot10"       // Молотов
bind "v" "slot6"        // Хаешка
bind "n" "use weapon_c4; drop" // Мгновенный дроп бомбы без потери оружия
bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"

host_writeconfig
echo ">>> CS2 PRO AUTOEXEC LOADED SUCCESSFULLY! <<<"